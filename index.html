<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مجزوءة الإنسان: الرغبة والمجتمع</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#0d1224;--bg2:#151b36;--ink:#ebe6d6;--mute:#a7a8bd;--lap:#7d98ff;--och:#e0ad4a;--ros:#d4677d;--line:#2a3258}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1224}}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){color-scheme:light;--bg:#f1ecdd;--bg2:#e6dfcb;--ink:#161a30;--mute:#555a78;--lap:#2d4bd1;--och:#9a6a10;--ros:#a3304a;--line:#c9c0a6}}
:root[data-theme="dark"]{color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:auto}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Naskh Arabic",serif;font-size:1.08rem;line-height:2.05;overflow-x:hidden}
h1,h2,h3,h4{font-family:Amiri,serif;line-height:1.35;margin:0}
#bar{position:fixed;top:0;right:0;height:4px;width:100%;background:linear-gradient(270deg,var(--och),var(--lap));transform-origin:right;transform:scaleX(0);z-index:50}
#glow{position:fixed;top:0;left:0;width:340px;height:340px;margin:-170px;border-radius:50%;background:radial-gradient(circle,var(--lap),transparent 65%);opacity:.13;pointer-events:none;z-index:0}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;display:flex;gap:.4rem;overflow-x:auto;padding:.7rem 1rem;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav a{flex:none;color:var(--mute);text-decoration:none;padding:.15rem .9rem;border-radius:99px;font-size:.95rem;line-height:1.9;transition:.3s}
nav a.on{color:var(--bg);background:var(--och)}
nav a:focus-visible,button:focus-visible{outline:2px solid var(--lap);outline-offset:2px}
.hero{min-height:92vh;display:grid;place-items:center;text-align:center;padding:4rem 1.2rem;position:relative;overflow:hidden}
.hero svg{position:absolute;inset:0;margin:auto;width:min(120vw,900px);opacity:.5}
.hero svg circle{fill:none;stroke:var(--line);stroke-width:1.2}
.hero h1{font-size:clamp(3rem,13vw,8rem);position:relative}
.hero h1 span{display:inline-block;overflow:hidden;vertical-align:bottom;padding:0 .12em}
.hero h1 b{display:inline-block;font-weight:700}
.hero p{position:relative;max-width:34rem;margin:1.2rem auto 0;color:var(--mute);font-size:1.2rem}
.hero .scroll{position:relative;margin-top:2.4rem;color:var(--och);font-family:Amiri}
wrap,.wrap{display:block;max-width:56rem;margin:0 auto;padding:0 1.2rem;position:relative;z-index:1}
section{padding:5rem 0 2rem}
.kick{color:var(--och);font-family:Amiri;font-size:1.2rem}
.big{font-size:clamp(2.4rem,9vw,5rem);margin:.2rem 0 1.4rem;overflow:hidden}
.big span{display:inline-block}
.sit{background:var(--bg2);border-right:4px solid var(--ros);padding:1.4rem 1.6rem;margin:1.5rem 0 2.4rem;border-radius:2px 14px 14px 2px}
.sit h3{color:var(--ros);font-size:1.5rem}
.ax{border-top:1px solid var(--line)}
.ax:last-child{border-bottom:1px solid var(--line)}
.ax>button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;width:100%;align-items:center;justify-content:space-between;gap:1rem;padding:1.3rem .2rem;font-family:Amiri;font-size:1.55rem;line-height:1.5}
.ax>button i{font-style:normal;color:var(--och);font-size:1.8rem;transition:transform .4s}
.ax.open>button i{transform:rotate(45deg)}
.bd{height:0;overflow:hidden}
.bd>div{padding:0 .2rem 1.8rem}
.q{color:var(--lap);font-family:Amiri;font-size:1.25rem;margin:0 0 .6rem}
.bd ul{padding-inline-start:1.3rem;margin:.5rem 0 1.2rem}
.bd li{margin-bottom:.5rem}
.bd li::marker{color:var(--och)}
.th{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:.8rem}
.th div{border:1px solid var(--line);padding:.8rem 1rem;border-radius:10px;line-height:1.85;font-size:1rem;color:var(--mute)}
.th strong{display:block;color:var(--ink);font-family:Amiri;font-size:1.2rem}
.sum{margin-top:1.2rem;padding:1rem 1.2rem;border-radius:10px;background:color-mix(in srgb,var(--lap) 14%,transparent)}
.more{margin:1.6rem 0 .4rem;color:var(--och);font-size:1.35rem}.bd p{margin:.4rem 0 .9rem}
.gl{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:1rem;margin-top:1.5rem}
.gl div{padding:1.1rem 1.2rem;border-radius:14px;background:var(--bg2);border:1px solid var(--line);line-height:1.9;font-size:1rem}
.gl h4{color:var(--och);font-size:1.4rem}
.refs{columns:2 15rem;column-gap:2rem;padding-inline-start:1.3rem;margin-top:1.5rem}
.refs li{margin-bottom:.5rem;break-inside:avoid}
footer{padding:5rem 1.2rem 4rem;text-align:center;color:var(--mute);font-family:Amiri;font-size:1.3rem}
@media (prefers-reduced-motion:reduce){#glow{display:none}}
</style>
</head>

<div><h1 id="h1"></h1><p id="hp">رحلة معمّقة في مفهومَي الرغبة والمجتمع: وضعيات مشكلة، محاور، فلاسفة، وأسئلة تفتح باب التفكير.</p><div class="scroll">انزل لتبدأ</div></div>
</header>

<script>
const D=[
{id:"ideo",k:"تتمة المفهوم السابق",t:"الإيديولوجيا والوهم",
sit:["المحور الثالث: الإيديولوجيا والوهم","نعتقد أحيانًا أن أفكارنا نابعة من عقل حر، ثم نكتشف أنها صدى لمصالح وعادات ورغبات خفية. كيف نميّز الحقيقة من الإيديولوجيا ومن الوهم؟"],
axes:[{t:"الإيديولوجيا: وعي مقلوب أم رؤية للعالم؟",q:"هل الإيديولوجيا تشويه للواقع أم شرط للعيش الجماعي؟",
pts:["الإيديولوجيا منظومة أفكار وقيم تبرّر نظامًا اجتماعيًا وتُظهر مصالح فئة على أنها مصلحة الجميع.","تتخفى في اللغة والمدرسة والإعلام فتبدو بديهية وطبيعية، وهنا خطرها.","يصعب كشفها من الداخل لأن حاملها يراها حقيقة لا رأيًا."],
th:[["ماركس","الأفكار السائدة في عصر ما هي أفكار الطبقة المسيطرة، والوعي يقلب الواقع كما تقلب عدسة الصورة."],["ألتوسير","الأجهزة الإيديولوجية كالمدرسة والأسرة تصنع أفرادًا يخضعون طوعًا."],["غرامشي","الهيمنة تقوم على القبول الثقافي لا على القوة وحدها."]]},
{t:"الوهم: حين تصنع الرغبة اعتقاداتنا",q:"ما الفرق بين الخطأ والوهم؟",
pts:["الخطأ يُصحَّح بالدليل، أما الوهم فتسنده رغبة، ولذلك يقاوم البرهان.","الوهم ليس بالضرورة كاذبًا، لكنه يُصدَّق لأنه يرضينا لا لأنه يثبت.","العلم يتقدم بنقد أوهامه ومعارفه السابقة."],
th:[["فرويد","الدين وهم لأنه يستمد قوته من رغبة الإنسان في الحماية."],["بيكون","الأوهام الأربعة: القبيلة والكهف والسوق والمسرح، وهي عوائق أمام معرفة موضوعية."],["باشلار","المعرفة العلمية تتقدم بالقطيعة مع الرأي والعوائق الإبستمولوجية."]],
s:"الحقيقة جهد نقدي مستمر لتفكيك ما يبدو لنا بديهيًا."}]},
{id:"desire",k:"المفهوم الأول",t:"مفهوم الرغبة",
sit:["الوضعية المشكلة: لعبة الرغبة","نشتهي شيئًا بشدة، فإذا نلناه فترت الشهوة وطلبنا غيره. هل الرغبة نقص يؤلم أم قوة تدفعنا إلى الأمام؟ ولماذا لا يكتمل الإشباع أبدًا؟"],
axes:[
{t:"المحور الأول: الرغبة والحاجة",q:"هل الرغبة حاجة بيولوجية مهذّبة أم أمر مختلف جذريًا؟",
pts:["الحاجة ضرورة عضوية محدودة بموضوع معيّن وتنتهي عند الإشباع، كالجوع والعطش.","الرغبة تتجاوز الضرورة: نريد طعامًا معيّنًا بطريقة معيّنة وأمام أعين معيّنة، فالرغبة مشبعة بالرموز والثقافة.","الاستهلاك المعاصر يصنع رغبات جديدة تُقدَّم كأنها حاجات.","لذلك يبدو الإنسان كائنًا لا يكتفي بما تمنحه الطبيعة."],
th:[["أفلاطون","الرغبة نقص يدفع صاحبه نحو ما يفتقده، كما في أسطورة إيروس ابن الفقر."],["هيغل","الرغبة الإنسانية تطلب اعتراف الآخر لا امتلاك الشيء فقط."],["ماركس","الحاجات الإنسانية تاريخية، تتشكل بتطور المجتمع وأنماط الإنتاج."],["بودريار","في مجتمع الاستهلاك تصير الأشياء علامات للمكانة لا أدوات للنفع."]],
s:"الحاجة تُشبَع والرغبة تتجدد، وهذا ما يمنح الإنسان بعدًا رمزيًا وتاريخيًا."},
{t:"المحور الثاني: الرغبة والإرادة",q:"هل نحن عبيد رغباتنا أم نملك سلطة عليها؟",
pts:["الرغبة ميل عفوي ينبع من الجسد والانفعال، أما الإرادة فقرار واعٍ يزن البدائل.","الإرادة قد تعارض الرغبة، كمن يمتنع عن لذة حاضرة طلبًا لخير أبعد.","لكن قد تكون الإرادة نفسها رغبة متنكرة، فيصير سؤال الحرية أعمق."],
th:[["كانط","الإرادة الخيّرة هي التي تتبع الواجب الذي يقرّه العقل لا الميول الحسية."],["سبينوزا","الرغبة ماهية الإنسان، والحرية معرفة بأسباب رغباتنا لا غياب لها."],["شوبنهاور","الإرادة قوة عمياء تدفعنا دون غاية، والعقل خادم لها."],["أرسطو","الاختيار يقوم على التروي، فهو رغبة يوجّهها العقل."]],
s:"الإرادة ليست نقيض الرغبة بل صورتها الواعية حين يُهذّبها التفكير."},
{t:"المحور الثالث: الرغبة والسعادة",q:"هل تتحقق السعادة بإشباع الرغبات أم بالتحكم فيها؟",
pts:["إشباع كل رغبة قد يوهم بالسعادة، لكنه يفتح رغبات أخرى بلا نهاية.","التحرر من الرغبة قد يمنح طمأنينة، لكنه قد يفقر الحياة من الحماسة.","السعادة قد تكون فنَّ تدبير الرغبات وترتيبها لا القضاء عليها."],
th:[["كاليكليس وسقراط","الأول يدعو إلى إشباع بلا حدود، والثاني يشبّه ذلك بجرة مثقوبة لا تمتلئ."],["أبيقور","نميّز الرغبات الطبيعية الضرورية من غيرها، ونقتصر على ما يحفظ صفاء النفس."],["الرواقيون","السعادة في الانسجام مع الطبيعة والتحرر من الانفعالات."],["شوبنهاور","الحياة تتأرجح بين ألم الحرمان وملل الإشباع."]],
s:"السعادة ليست حاصل الإشباع، بل نمط من التوازن بين الرغبة والعقل."}]},
{id:"soc",k:"المفهوم الثاني",t:"مفهوم المجتمع",
sit:["الوضعية المشكلة: هي وهو","حوار بين امرأة ورجل يكشف أن كثيرًا مما نظنه طبيعيًا هو في الحقيقة عادات وأدوار صنعها المجتمع. فهل المجتمع معطى طبيعي أم بناء؟ وإلى أي حد يصنعنا؟"],
axes:[
{t:"المحور الأول: أساس المجتمع",q:"لماذا يعيش البشر معًا: بالطبع أم بالاتفاق؟",
pts:["القول الطبيعي: الإنسان لا يكتمل خارج الجماعة، فالحياة المشتركة امتداد لطبيعته.","القول التعاقدي: المجتمع ثمرة اتفاق بين أفراد سبقوا النظام الاجتماعي.","كلا التفسيرين يحدد ما نتوقعه من الدولة والقانون."],
th:[["أرسطو","الإنسان كائن مدني بطبعه، والمدينة سابقة على الفرد في الغاية."],["ابن خلدون","الاجتماع ضروري لتحصيل الغذاء والدفاع، وتقوم الدولة على العصبية."],["هوبز","حالة الطبيعة حرب الجميع ضد الجميع، فنتنازل للسلطة طلبًا للأمن."],["روسو","العقد الاجتماعي يحوّل الحرية الطبيعية إلى حرية مدنية قوامها الإرادة العامة."]],
s:"المجتمع حاجة وغاية معًا، وبين الطبع والعقد يتحدد معنى الشرعية."},
{t:"المحور الثاني: الفرد والمجتمع",q:"هل الفرد صانع المجتمع أم نتاجه؟",
pts:["الاتجاه الاجتماعي يرى أن اللغة والقيم والأدوار تسبقنا وتصوغ هويتنا.","الاتجاه الفردي يؤكد أن الفرد يستطيع أن ينقد ويغيّر ما ورثه.","العلاقة جدلية: نتشكل بالمجتمع ونعيد تشكيله."],
th:[["دوركايم","الظواهر الاجتماعية خارجة عن الأفراد وملزمة لهم، والوعي الجمعي يسبقهم."],["ماركس","الماهية الإنسانية ليست جوهرًا فرديًا بل مجموع العلاقات الاجتماعية."],["سارتر","الوجود يسبق الماهية، فالإنسان مسؤول عن اختياره حتى داخل شروطه."],["ستيوارت ميل","للمجتمع سلطة على الفرد لا تتعدى منع الضرر عن الآخرين."]],
s:"الفرد ابن مجتمعه، لكنه قادر على تجاوز ما صُنع منه."},
{t:"المحور الثالث: سلطة المجتمع",q:"ما حدود قدرة المجتمع على توجيه الأفراد؟",
pts:["السلطة لا تعمل بالقانون وحده بل بالعرف والمراقبة وتوقع نظرة الآخرين.","قد تتحول المعايير إلى عنف رمزي لا يُرى لأنه مقبول.","السلطة مشروعة حين تحمي الحرية، ومرفوضة حين تُلغيها."],
th:[["فيبر","السلطة تحتاج إلى شرعية: تقليدية أو كاريزمية أو عقلانية قانونية."],["فوكو","السلطة شبكة علاقات تنتج المعرفة والانضباط عبر المراقبة."],["بورديو","العنف الرمزي يفرض المعايير كأنها طبيعية بموافقة ضحاياه."],["دو بوفوار","لا يولد المرء امرأة بل يصير كذلك، فالأدوار تُصنع اجتماعيًا."]],
s:"السلطة الاجتماعية قدر مشترك، وسؤال الفلسفة هو متى تحمي الحرية ومتى تقيّدها."}]}];
const G=[["الرغبة","نزوع واعٍ نحو موضوع غائب يُحسّ بنقصه، يتجاوز الحاجة إلى الرمزي."],["الحاجة","ضرورة عضوية أو نفسية يزول ألمها بالإشباع."],["الإرادة","قدرة على اتخاذ القرار والتصرف وفق غايات اختيرت بوعي."],["السعادة","حالة رضا مستقر تختلف الفلسفات في أسبابها وشروطها."],["الإيديولوجيا","منظومة تصورات تبرّر وضعًا اجتماعيًا وتخدم مصلحة فئة."],["الوهم","اعتقاد تغذّيه الرغبة أكثر مما يسنده الدليل."],["المجتمع","جماعة منظمة تربطها قواعد ولغة وقيم ومؤسسات."],["العقد الاجتماعي","اتفاق فرضي بين الأفراد يؤسس السلطة والقانون."],["الوعي الجمعي","مجموع المعتقدات والمشاعر المشتركة التي تلزم الأفراد."],["السلطة","قدرة على فرض الطاعة أو توجيه السلوك، بالقوة أو بالشرعية."],["الاغتراب","شعور الفرد بأن ما صنعه أو انتمى إليه صار غريبًا عنه."],["الهوية","ما يجعل الذات نفسها عبر الزمن، وتتشكل فرديًا واجتماعيًا."]];
const R=["الجمهورية والمأدبة وغورجياس، أفلاطون","الأخلاق إلى نيقوماخوس، أرسطو","الأخلاق، سبينوزا","العالم إرادةً وتمثلًا، شوبنهاور","تأسيس ميتافيزيقا الأخلاق، كانط","لوفياثان، هوبز","في العقد الاجتماعي، روسو","المقدمة، ابن خلدون","قواعد المنهج في علم الاجتماع، دوركايم","الإيديولوجيا الألمانية، ماركس","مستقبل وهم، فرويد","المراقبة والمعاقبة، فوكو","الجنس الآخر، دو بوفوار","تكوين العقل العلمي، باشلار"];
const X={
"الإيديولوجيا: وعي مقلوب أم رؤية للعالم؟":["يستعمل ماركس صورة الغرفة المظلمة: كما تنقلب الصورة على شبكية العين، يرى الناس علاقاتهم الاجتماعية مقلوبة، فيظنون الأفكار هي التي تصنع الواقع وهي في الحقيقة نتاج ظروف مادية. ومن هنا تأتي وظيفتها: تحويل ما هو تاريخي وقابل للتغيير إلى ما يبدو أبديًا.","غير أن الإيديولوجيا لا تقتصر على التضليل. فعند غرامشي وريكور تؤدي وظيفة دمج الجماعة وتوفير رؤية مشتركة وذاكرة وهوية. والنقد الأهم: من يكشف الإيديولوجيا يتكلم هو أيضًا من موقع ما، فهل ينجو نقده من الإيديولوجيا؟ هذا الاعتراض يدفعنا إلى نقد ذاتي دائم بدل ادعاء الحياد الكامل."],
